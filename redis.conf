# # =============================================================================
# # REDIS PRODUCTION CONFIGURATION
# # =============================================================================

# # Basic Settings
# bind 127.0.0.1 ::1
# port 6379
# requirepass ${REDIS_PASSWORD}

# # =============================================================================
# # PERSISTENCE CONFIGURATION
# # =============================================================================

# # RDB Snapshots (Point-in-time backups)
# save 900 1    # Save if at least 1 key changed in 900 seconds
# save 300 10   # Save if at least 10 keys changed in 300 seconds  
# save 60 10000 # Save if at least 10000 keys changed in 60 seconds

# # RDB file settings
# dbfilename dump.rdb
# dir /data

# # AOF (Append Only File) for durability
# appendonly yes
# appendfilename "appendonly.aof"
# appendfsync everysec  # fsync every second (good balance of performance/durability)

# # AOF rewrite settings
# no-appendfsync-on-rewrite no
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 64mb

# # =============================================================================
# # MEMORY MANAGEMENT
# # =============================================================================

# # Maximum memory (adjust based on your droplet size)
# maxmemory 1gb

# # Eviction policy when memory limit is reached
# maxmemory-policy allkeys-lru

# # =============================================================================
# # SECURITY
# # =============================================================================

# # Disable dangerous commands
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG "CONFIG_9ef7ac18b4c2"

# # =============================================================================
# # PERFORMANCE TUNING
# # =============================================================================

# # TCP settings
# tcp-keepalive 300
# tcp-backlog 511

# # Client settings
# timeout 0
# maxclients 10000

# # =============================================================================
# # LOGGING
# # =============================================================================

# loglevel notice
# logfile /var/log/redis/redis-server.log

# # =============================================================================
# # SLOW LOG (for monitoring)
# # =============================================================================

# slowlog-log-slower-than 10000  # Log queries slower than 10ms
# slowlog-max-len 128
