# =============================================================================
# STREAMLINED CI/CD PIPELINE FOR WAT BACKEND
# =============================================================================
# 
# Optimized pipeline focusing on essential deployment steps:
# 1. Quality checks (lint, test, build)
# 2. Docker image creation 
# 3. Deployment to staging/production
# 4. Health verification
#
# =============================================================================

name: Deploy WAT Backend

on:
  push:
    branches: [main, production]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vcern/wat-backend
  NODE_VERSION: '22'

jobs:
  # ==========================================================================
  # QUALITY CHECKS
  # ==========================================================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run quality checks
        run: |
          npm run build

  # ==========================================================================
  # DOCKER BUILD AND REGISTRY PUSH
  # ==========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          target: production
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image
        id: image
        run: echo "image=${{ steps.meta.outputs.tags }}" >> $GITHUB_OUTPUT

  # ==========================================================================
  # DEPLOY TO STAGING
  # ==========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging-api.wat.vcern.com
    timeout-minutes: 10
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            # Pull latest image
            docker pull ${{ needs.build.outputs.image }}
            
            # Stop existing container
            docker stop wat-backend-staging || true
            docker rm wat-backend-staging || true
            
            # Start new container
            docker run -d \
              --name wat-backend-staging \
              --restart unless-stopped \
              -p 3001:3000 \
              --env-file ~/.env.staging \
              --network wat-network \
              ${{ needs.build.outputs.image }}
            
            # Wait for startup
            sleep 30
            
            # Health check
            if curl -f http://localhost:3001/health; then
              echo "Staging deployment successful"
            else
              echo "Staging health check failed"
              exit 1
            fi

  # ==========================================================================
  # DEPLOY TO PRODUCTION
  # ==========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/production'
    environment:
      name: production
      url: https://api.wat.vcern.com
    timeout-minutes: 15
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            # Pull latest image
            docker pull ${{ needs.build.outputs.image }}
            
            # Blue-green deployment
            if docker ps --format "table {{.Names}}" | grep -q "wat-backend-blue"; then
              CURRENT="blue"
              NEXT="green"
              NEXT_PORT=3001
            else
              CURRENT="green"
              NEXT="blue"
              NEXT_PORT=3000
            fi
            
            echo "Deploying to $NEXT container"
            
            # Stop and remove next container
            docker stop wat-backend-$NEXT || true
            docker rm wat-backend-$NEXT || true
            
            # Start new container
            docker run -d \
              --name wat-backend-$NEXT \
              --restart unless-stopped \
              -p $NEXT_PORT:3000 \
              --env-file ~/.env.production \
              --network wat-network \
              ${{ needs.build.outputs.image }}
            
            # Wait for startup
            sleep 45
            
            # Health check
            if curl -f http://localhost:$NEXT_PORT/health; then
              # Update nginx config
              sudo sed -i "s/wat-backend-$CURRENT/wat-backend-$NEXT/g" /etc/nginx/sites-available/wat-api
              sudo nginx -t && sudo systemctl reload nginx
              
              # Stop old container
              sleep 10
              docker stop wat-backend-$CURRENT || true
              docker rm wat-backend-$CURRENT || true
              
              echo "Production deployment successful - Active: $NEXT"
            else
              echo "Production health check failed - Rolling back"
              docker stop wat-backend-$NEXT
              docker rm wat-backend-$NEXT
              exit 1
            fi
